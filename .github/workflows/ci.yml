name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aucn
          POSTGRES_PASSWORD: aucn
          POSTGRES_DB: aucnhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aucn -d aucnhub" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://aucn:aucn@localhost:5432/aucnhub?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-ci-only-access-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret-ci-only-refresh-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aucn/api prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @aucn/api prisma:migrate:deploy
      - run: pnpm test
      - run: pnpm build
