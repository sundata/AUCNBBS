services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aucn
      POSTGRES_PASSWORD: aucn
      POSTGRES_DB: aucnhub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aucn -d aucnhub']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
